name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.x

jobs:
  # Fast feedback: formatting, lint and types run in parallel with the tests.
  static:
    name: Format · Lint · Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the pinned version from package.json's "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint --max-warnings=0

      - name: TypeScript
        run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E · Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      # Covers the production build, locale routing, theming and an axe-core
      # scan of every route in both languages.
      - name: Playwright (production build)
        run: pnpm test:e2e

      # The Playwright run above built the app; this reads that build's chunk
      # list and fails if any route's first-load JS is over budget.
      - name: JS budget
        run: pnpm check:bundle

      # React's diagnostic warnings only exist in its development build, so
      # this run is the only thing that can catch them.
      - name: Playwright (dev server)
        run: pnpm test:e2e:dev

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    # Only the push to main publishes the badge; every run asserts the scores.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Mobile, applied throttling, median of three runs per page. Fails on
      # performance < 95, anything else < 100, or CLS > 0.05.
      - name: Lighthouse CI
        run: pnpm lighthouse

      - name: Badge
        if: ${{ !cancelled() }}
        run: pnpm lighthouse:badge

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14

      # The README's badge reads this file from the `badges` branch, which
      # holds nothing else — so publishing a score never touches main.
      - name: Publish badge
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          cp .lighthouseci/badge.json "$RUNNER_TEMP/lighthouse.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin badges:badges 2>/dev/null; then
            git switch badges
          else
            # A fresh orphan branch starts with an empty index and tree.
            git switch --orphan badges
          fi
          cp "$RUNNER_TEMP/lighthouse.json" lighthouse.json
          git add lighthouse.json
          git diff --cached --quiet || git commit -m "chore(ci): update lighthouse badge"
          git push origin badges
